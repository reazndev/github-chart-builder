name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait 15 seconds and trigger Komodo webhook
        env:
          KOMODO_WEBHOOK: ${{ secrets.KOMODO_WEBHOOK || vars.KOMODO_WEBHOOK }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET || vars.KOMODO_WEBHOOK_SECRET }}
        run: |
          echo "Waiting 15 seconds before triggering webhook..."
          sleep 15
          
          # Construct payload
          PAYLOAD="{\"event\": \"build_complete\", \"status\": \"success\", \"repository\": \"${{ github.repository }}\", \"secret\": \"$KOMODO_WEBHOOK_SECRET\"}"
          
          # Generate GitHub-style HMAC-SHA256 signature using the secret
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | cut -d' ' -f2)
          
          # Trigger webhook with the required signature header
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-GitHub-Event: push" \
            -d "$PAYLOAD" \
            "$KOMODO_WEBHOOK"

services:
  chart-builder:
    build: .
    image: ghcr.io/reazndev/github-chart-builder:latest
    container_name: github-chart-builder
    restart: unless-stopped
    ports:
      - "8030:8030"
    environment:
      - PORT=8030
      - NODE_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - THEME_SALT=${THEME_SALT:-${ENCRYPTION_KEY}}
    volumes:
      - ./data:/app/data

